            --tool AnnotateIntervals --tool CheckPileup \
            --tool FastaReferenceMaker --tool CollectReadCounts \
            --tool GetPileupSummaries --tool UnmarkDuplicates \
            --tool CalculateContamination --tool PrintReadsHeader \
            --tool RevertBaseQualityScores --tool AddOriginalAlignmentTags \
            --tool LeftAlignIndels --tool DumpTabixIndex \
