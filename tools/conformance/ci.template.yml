            --tool ConvertHeaderlessHadoopBamShardToBam \
            --tool VCFComparator \
            --tool FuncotatorDataSourceDownloader \
            --tool FuncotateSegments --tool Funcotator \
            --tool VariantRecalibrator \
            --tool ExtractVariantAnnotations \
            --tool FilterAlignmentArtifacts \
            --tool HaplotypeCaller --tool RampedHaplotypeCaller --tool Mutect2 \
            --tool AddCommentsToBam --tool BuildBamIndex --tool CheckTerminatorBlock \
            --tool FilterVcf --tool FixVcfHeader --tool GatherBamFiles --tool GatherVcfs \
            --tool MakeSitesOnlyVcf --tool MergeVcfs --tool RenameSampleInVcf \
            --tool SetNmAndUqTags --tool SetNmMdAndUqTags --tool SortVcf --tool SplitVcfs \
            --tool UpdateVcfSequenceDictionary --tool VcfFormatConverter --tool VcfToIntervalList \
            --port target/release/gatk --corpus-dir /tmp/coverage-corpus

      - name: The committed measurement is the one this run produces
        # Same rule as a golden: the number in the tree has to be the number CI re-derives, or the
        # dashboard is printing a claim nothing checks. A first run publishes the file as an
        # artefact and this step reports the diff rather than failing, which is how the first
        # measurement gets into the tree at all.
        run: git --no-pager diff --stat tools/coverage/measured.json

      - name: Record what the run was made of
        # This job holds both the image and the toolchain, so it is where a third party's run can
        # be told apart from this one: inputs' hashes, pins, container and compression provider.
        if: always()
        run: python3 tools/provenance/record.py --out provenance.json

      - name: Publish the provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provenance
          path: provenance.json
          if-no-files-found: error

      - name: Publish what the run measured
        # The corpus goes with the number, and not as decoration: a share of 5/6 says a row
        # diverged and says nothing about which, and the corpus is where that is read.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-coverage
          path: |
            tools/coverage/measured.json
            /tmp/coverage-corpus/
          if-no-files-found: ignore

  fuzz:
    name: "Differential fuzzing, seeded from the covering arrays (shard ${{ matrix.shard }}/8)"
    # V.6. The arrays cover pairs of argument values; this measures which of the reference's
    # branches those pairs reach, mutates one argument at a time to reach more, and replays every
    # case it keeps against the port. The number goes to tools/fuzz/measured.json, frozen from this
    # job's artefacts like every other measurement; a divergence is evidence for a finding, not a
    # red build, so the job fails only when the harness cannot fuzz anything at all.
    needs: oracle-image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/cache/restore@v6
        with:
          path: /tmp/oracle-image.tar
          key: gatk-rs-oracle-${{ hashFiles('tools/oracle/**') }}
          fail-on-cache-miss: true

      - run: docker load -i /tmp/oracle-image.tar

      - name: nasm, which gkl-igzip needs to build
        run: |
          sudo apt-get update -qq || echo "apt refresh incomplete; the install below is the gate"
          sudo apt-get install -y -qq nasm python3-h5py
          nasm -v

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release -p gatk-cli

      - name: Fuzz the reference and replay against the port
        run: |
          python3 tools/fuzz/run_fuzz.py --shard ${{ matrix.shard }}/8 --iterations 30 \
            --port target/release/gatk

      - name: Publish the findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-findings-${{ matrix.shard }}
          path: tools/fuzz/findings/
          if-no-files-found: ignore

  nvscorevariants:
    name: NVScoreVariants on real x86-64
    # The one job with broadinstitute/gatk:4.7.0.0, which is a second image next to the pinned oracle
    # because that one has no Python. Everything else about this tool is measured under Rosetta at
    # AVX2, so this is where those measurements get checked: which CPU dispatch the reference took,
    # how far the port's layers are from it there, and whether the printed scores still agree. The
    # bit-level lines are printed and asserted nowhere. The printed scores are asserted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - name: Weights, fixture, and the reference's dump and layers
        env:
          IMAGE: broadinstitute/gatk@sha256:7da5cf586e1c463f0c72908f9ac7dec8c29e37912c82d6e7b3c250f27fcb3891
        run: |
          mkdir -p /tmp/nv
          chmod 777 /tmp/nv
          grep -m1 "model name" /proc/cpuinfo
          grep -m1 -o -E "avx512f|avx2" /proc/cpuinfo || true
          run() { docker run --rm --platform linux/amd64 -v "$PWD/tools/nvscorevariants:/harness:ro" -v /tmp/nv:/nv "$IMAGE" "$@"; }
          run python3 /harness/extract_weights.py /nv
          run python3 /harness/make_fixture.py /nv/fixture
          run python3 /harness/NVScoreVariantsDump.py /nv/fixture > /tmp/nv/reference.dump
          run env OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 ONEDNN_VERBOSE=1 python3 /harness/dump_layers.py reference /nv/fixture/variants.vcf /nv/fixture/reference.fasta - 64 /nv/d1d.bin /nv/d1d.scores | grep -m3 -E "onednn_verbose,(info,cpu,isa|exec,cpu,convolution)" || true
          run env OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python3 /harness/dump_layers.py read_tensor /nv/fixture/variants.vcf /nv/fixture/reference.fasta /nv/fixture/reads.bam 64 /nv/d2d.bin /nv/d2d.scores

      - name: nasm, which `gkl-igzip` needs to build ISA-L's assembly
        run: |
          sudo apt-get update -qq || echo "apt refresh incomplete; the install below is the gate"
          sudo apt-get install -y -qq nasm
          nasm -v

      - name: The layers against the port, for the record
        env:
          NVSCORE_LAYERS_1D: reference /tmp/nv/fixture/variants.vcf /tmp/nv/fixture/reference.fasta - 64 /tmp/nv/d1d.bin /tmp/nv
          NVSCORE_LAYERS_2D: read_tensor /tmp/nv/fixture/variants.vcf /tmp/nv/fixture/reference.fasta /tmp/nv/fixture/reads.bam 64 /tmp/nv/d2d.bin /tmp/nv
        run: |
          NVSCORE_LAYERS="$NVSCORE_LAYERS_1D" cargo test --release -p gatk-tools --test nv_score_variants_layers -- --nocapture
          NVSCORE_LAYERS="$NVSCORE_LAYERS_2D" cargo test --release -p gatk-tools --test nv_score_variants_layers -- --nocapture

      - name: The printed scores and every VCF against the reference
        env:
          NVSCORE_OUTPUT: /tmp/nv/reference.dump /tmp/nv/fixture /tmp/nv
        run: cargo test --release -p gatk-tools --test nv_score_variants_output -- --nocapture

  spark-threads:
    name: The Spark tools at one thread and at four are the same bytes
    needs: oracle-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: /tmp/oracle-image.tar
          key: gatk-rs-oracle-${{ hashFiles('tools/oracle/**') }}
          fail-on-cache-miss: true

      - run: docker load -i /tmp/oracle-image.tar

      - name: nasm, which is what makes GKL's igzip exact rather than merely valid
        # As in `argument-coverage`: without it a build cannot write a block-compressed file.
        run: |
          sudo apt-get update -qq || echo "apt refresh incomplete; the install below is the gate"
          sudo apt-get install -y -qq nasm
          nasm -v

      - name: Build the port binary
        run: cargo build --release -p gatk-cli

      - name: Every Spark tool's rows, at RAYON_NUM_THREADS 1 and 4
        # #72: a parallel path has to be proved byte-equal, not concordant. docs/spark-parallel.md.
        timeout-minutes: 60
        run: python3 tools/coverage/thread_independence.py --port target/release/gatk --threads 4

  oracle-with-r:
    name: "Oracle with R: the plots around their images"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Room for the Broad's image
        # 8.5 GB unpacked, beside a release build of the workspace. The Android SDK is not ours.
        run: |
          sudo rm -rf /usr/local/lib/android
          df -h /

      - name: nasm, R and the packages the rewritten scripts load
        # The distribution's packages, so that the job does not depend on CRAN and does not spend
        # its time compiling them. The scripts' own bootstrap would otherwise install them; what it
        # does when it cannot is checked by the test below. The refresh may fail for the reason the
        # `test` job gives, and the install is the gate.
        run: |
          sudo apt-get update -qq || echo "apt refresh incomplete; the install below is the gate"
          sudo apt-get install -y -qq --no-install-recommends nasm r-base-core r-cran-optparse \
            r-cran-data.table r-cran-ggplot2 r-cran-cowplot r-cran-dplyr
          Rscript -e 'for (p in c("optparse", "data.table", "ggplot2", "cowplot", "dplyr")) cat(p, as.character(packageVersion(p)), "\n"); cat(R.version.string, capabilities("cairo"), "\n")'

      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned; must match rust-toolchain.toml.
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2

      - name: The reference with R there to run its scripts
        # gatk-rs-oracle has no Rscript on purpose, so this suite names the Broad's published image
        # of the release, pinned by digest in the manifest's `oracle_with_r`. A separate image means
        # a separate pull, about 2.4 GB, which is why it is not in the `oracle` matrix.
        timeout-minutes: 30
        run: |
          docker pull "$(python3 -c 'import json; print(json.load(open("tools/conformance/manifest.json"))["oracle_with_r"]["image"])')"
          python3 tools/conformance/run_suite.py --suites r-plots

      - name: The port against what the reference just did
        # No PNG byte is compared: see tools/conformance/manifest.json. The dump is read directly,
        # so that this holds from the first run; freezing the candidate below changes nothing here
        # except that the `test` job's machines without R go on skipping.
        timeout-minutes: 30
        env:
          GATK_RS_REQUIRE_R: "1"
          GATK_RS_R_PLOTS_DUMP: ${{ github.workspace }}/tools/conformance/pending/r-plots.RPlotsDump.txt
        run: cargo test --release -p gatk-cli --test r_plots_end_to_end --test interpreter_tools_end_to_end

      - name: Publish what the container produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-goldens-r-plots
          path: tools/conformance/pending/
          if-no-files-found: ignore

  inventory:
    name: Inventory is internally consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the generated inventory against itself
        # The inventory is generated, so the risk is not that it is wrong by hand but that it
        # is stale or partially regenerated. These checks catch both.
        run: |
          python3 - <<'PY'
          import json, re, sys
          inv = json.load(open('tools/inventory/generated/inventory.json'))
          fail = []

          counts = inv['counts']
          tools = inv['tools']

          if len(tools) != counts['tools']:
              fail.append(f"counts.tools={counts['tools']} but {len(tools)} tool entries")
          if counts['tools'] != counts.get('cli_reported_tools'):
              fail.append(f"tools={counts['tools']} != cli_reported_tools="
                          f"{counts.get('cli_reported_tools')}; the inventory no longer matches "
                          f"what `gatk --list` reports")

          total_args = sum(len(t['arguments']) for t in tools)
          if total_args != counts['arguments']:
              fail.append(f"counts.arguments={counts['arguments']} but {total_args} counted")

          # Every runnable tool must have at least one argument. A zero-argument entry means a
          # non-tool (a metrics definition class) leaked back into the tool list.
          empty = [t['name'] for t in tools if not t['arguments']]
          if empty:
              fail.append(f"{len(empty)} tools with no arguments, e.g. {empty[:5]}")

          # Names must be invocable: the " (Picard)" display suffix must have been stripped.
          suffixed = [t['name'] for t in tools if '(' in t['name']]
          if suffixed:
              fail.append(f"non-invocable tool names present: {suffixed[:5]}")

          # Branch names must be unique, or two tools would collide on one branch.
          branches = [t['branch'] for t in tools]
          dupes = {b for b in branches if branches.count(b) > 1}
          if dupes:
              fail.append(f"duplicate branch names: {sorted(dupes)[:5]}")

          for f in fail:
              print("FAIL:", f)
          print(f"tools={len(tools)} arguments={total_args} "
                f"spark={sum(1 for t in tools if t['spark'])} "
                f"undocumented={sum(1 for t in tools if not t.get('documented', True))}")
          sys.exit(1 if fail else 0)
          PY

      - name: Generator runs and is deterministic
        run: |
          python3 -c "import ast,sys; ast.parse(open('tools/inventory/generate_inventory.py').read())"
          python3 -c "import ast,sys; ast.parse(open('tools/inventory/extract_undocumented.py').read())"
          echo "generators parse"

  dashboard:
    name: The status dashboard matches its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docs/STATUS.md is generated, not written
        # It is generated from the inventory and the vendored port summaries under
        # tools/dashboard/ports, both of which are committed, so this runs with only this
        # repository checked out. Refreshing the summaries from the siblings' fetched main is
        # `--refresh`, and is a deliberate, reviewable commit.
        run: python3 tools/dashboard/generate.py --check

      - name: docs/VALIDATION.md is generated, not written
        # What each tool's state rests on, counted from the goldens and measurements committed
        # here, so a freeze that does not regenerate it fails.
        run: python3 tools/reports/generate.py --check

  coverage:
    name: Covering arrays cover what they claim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The arrays are verified, not asserted
        # --verify enumerates every t-way tuple of the domain and checks the array covers it, so a
        # regression in the generator fails here rather than producing an array that looks covered.
        # One small tool, one large one, and t=3 on the large one, which is the shape the plan
        # commits to on the critical path.
        run: |
          python3 tools/coverage/covering.py --tool CollectQualityYieldMetrics --t 2 --verify
          python3 tools/coverage/covering.py --tool HaplotypeCaller --t 2 --verify
          python3 tools/coverage/covering.py --tool HaplotypeCaller --t 3 --verify
          python3 tools/coverage/covering.py --tool HaplotypeCaller --t 2 --numeric-policy perturb --verify

      - name: Constraints actually forbid something
        # A constraint that quietly does nothing is indistinguishable from one that works, and the
        # failure mode is silent: the array still verifies, and every row it produces is rejected
        # by the reference at run time (picard-rs decision 0009). So CI asserts that the forbidden
        # count is non-zero and that the array still covers every permitted tuple.
        run: |
          python3 tools/coverage/covering.py --tool CollectQualityYieldMetrics --t 2 \
            --fixtures tools/coverage/constraints.example.json --verify | tee /tmp/c.txt
          grep -q "missing=0" /tmp/c.txt || { echo "constrained array does not cover its space"; exit 1; }
          grep -qE "forbidden by constraints=[1-9]" /tmp/c.txt || {
            echo "the constraint forbade nothing; it is not being applied"
            exit 1
          }

      - name: The generator is deterministic
        # The arrays are meant to be regenerated and diffed. Two runs that disagree would make
        # every diff meaningless, and IPOG has enough tie-breaks for that to happen by accident.
        run: |
          python3 tools/coverage/covering.py --tool HaplotypeCaller --t 2 --json /tmp/a.json >/dev/null
          python3 tools/coverage/covering.py --tool HaplotypeCaller --t 2 --json /tmp/b.json >/dev/null
          cmp /tmp/a.json /tmp/b.json && echo "identical across runs"

      - name: The measured sizing still matches the document
        # docs/what-pairwise-coverage-costs.md states these numbers. If the inventory changes, the
        # document is stale, and a stale number in a sizing document is how a plan drifts.
        run: |
          python3 tools/coverage/covering.py --all --t 2 | tee /tmp/all.txt
          grep -q "oracle runs=19189" /tmp/all.txt || {
            echo "pairwise sizing changed; update docs/what-pairwise-coverage-costs.md"
            exit 1
          }
