name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: LICENSE and README state the same licence
        # gatk-rs is Apache 2.0 because GATK is Apache 2.0; htsjdk-rs and picard-rs are MIT.
        # Getting these crossed is easy and consequential, so it is checked rather than remembered.
        # Several third-party descriptions call GATK BSD-3-Clause; the authority is LICENSE.TXT in
        # the pinned clone.
        run: |
          grep -q "Apache License" LICENSE || { echo "LICENSE is not Apache 2.0"; exit 1; }
          grep -q "Apache License 2.0, matching GATK" README.md || { echo "README licence claim changed"; exit 1; }
          grep -qi "not the official GATK" README.md || { echo "attribution notice missing"; exit 1; }
          echo "licence and attribution consistent"

      - name: The workflow matches the conformance manifest
        # The oracle jobs are generated from tools/conformance/manifest.json. picard-rs's hand
        # edits grew that file to 1556 lines of drifted comparators before this guard existed.
        run: python3 tools/conformance/generate_ci.py --check

      - name: Every committed golden belongs to a declared suite
        # A golden nothing re-derives can only ever be compared against itself; picard-rs decision
        # 0008 records what that cost there.
        run: python3 tools/conformance/audit_goldens.py

  test:
    name: Test on real x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned; must match rust-toolchain.toml.
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Every ported symbol comes from a licence-compatible source
        # htsjdk-rs decision 0014: a transcription of GPL2-only HotSpot source was published in an
        # MIT crate and found eleven commits later by reading module headers. The same guard runs
        # in all three repositories now, not just the one where it was learned.
        run: python3 tools/audit/provenance.py crates

      - name: A file already explained does not lose its explanations
        # docs/COMMENTING.md. The guard is a ratchet, not a floor for the whole tree: it fails only
        # when a file on tools/audit/commented.txt drops below the density it was recorded at, so
        # the remaining files are a measured list rather than a feeling.
        run: python3 tools/audit/comment_density.py --check

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release

      - name: The ports below are pinned by revision, and every revision resolves
        # GATK's build.gradle pins picardVersion and htsjdkVersion. A floating dependency would let
        # the layer underneath change under a byte-identity claim without anything failing.
        #
        # Checking the FORM of the pin is not enough. `picard-analysis` carried htsjdk-rs's SHA on a
        # picard-rs URL for months and nothing noticed, because no crate depended on it: cargo never
        # resolved the pin, so it never had to exist. Every revision named in Cargo.toml must also
        # appear in Cargo.lock, which is cargo's own record of having resolved it.
        run: |
          if grep -E '^(htsjdk|picard|jmath)[a-z-]* = \{ git' Cargo.toml | grep -qv 'rev = "'; then
            echo "a dependency is not pinned to a revision"
            exit 1
          fi
          revisions=$(grep -oE 'rev = "[0-9a-f]+"' Cargo.toml | grep -oE '[0-9a-f]+' | sort -u)
          for revision in $revisions; do
            if ! grep -q "$revision" Cargo.lock; then
              echo "revision $revision is pinned in Cargo.toml and resolved nowhere in Cargo.lock"
              exit 1
            fi
          done
          echo "$revisions" | wc -l

  determinism:
    name: "Determinism: the same suites in a different environment"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned; must match rust-toolchain.toml.
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2

      - name: The suites pass under a foreign locale, timezone, temporary directory and one thread
        # V.7. Every claim in this repository is a byte claim, and a byte claim that holds only in
        # one environment is not one. The `test` job already runs the suites in the runner's own
        # environment; this runs them in a deliberately different one.
        #
        # LC_ALL is the axis that has actually bitten this programme: htsjdk-rs decision 0011
        # established that the REFERENCE's metrics formatting is locale-dependent, and the oracle
        # pins en_US because of it. Rust's `format!` is locale-independent by construction, so this
        # gate is what turns "by construction" into "measured": under fr_FR a locale-sensitive
        # formatter writes `0,333333` and every suite comparing a formatted number would fail.
        #
        # TZ moves any accidental date formatting; TMPDIR moves every fixture the suites write, so
        # a path that leaked into an output would show; and one test thread removes the scheduling
        # that hid a fixture race until it reached a loaded runner.
        run: |
          set -eux
          mkdir -p /tmp/gatk-rs-elsewhere
          sudo locale-gen fr_FR.UTF-8 || true
          LC_ALL=fr_FR.UTF-8 LANG=fr_FR.UTF-8 TZ=Asia/Kolkata \
            TMPDIR=/tmp/gatk-rs-elsewhere RUST_TEST_THREADS=1 \
            cargo test --workspace --release

      - name: Two clean builds of the same source are the same bytes
        # A port whose own build is not reproducible cannot support a claim that its output is.
        # One crate is enough to catch a build that embeds a path, a timestamp or a hostname, and
        # `gatk-engine` is the one every tool depends on.
        run: |
          set -eux
          cargo build --release -p gatk-engine
          find target/release -maxdepth 1 -name 'libgatk_engine*.rlib' -exec sha256sum {} \; \
            | sed 's#.*/##' > /tmp/build1.txt
          cargo clean
          cargo build --release -p gatk-engine
          find target/release -maxdepth 1 -name 'libgatk_engine*.rlib' -exec sha256sum {} \; \
            | sed 's#.*/##' > /tmp/build2.txt
          diff /tmp/build1.txt /tmp/build2.txt
          cat /tmp/build1.txt

# {{ORACLE_JOBS}}

  argument-coverage:
    name: The covering array, against the port binary
    needs: oracle-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: /tmp/oracle-image.tar
          key: gatk-rs-oracle-${{ hashFiles('tools/oracle/**') }}
          fail-on-cache-miss: true

      - run: docker load -i /tmp/oracle-image.tar

      - name: Build the port binary
        # linux/amd64, which is what the container runs. The port is executed INSIDE the container
        # rather than on the host, and the reason is the output: a Tribble index records the file
        # it was built from by path and by last-modified time, so a port run at a different mount
        # point produces a different index for a reason that is not the port's.
        run: cargo build --release -p gatk-cli

      - name: Run the array against both sides
        run: |
          python3 tools/coverage/measure.py --tool IndexFeatureFile \
            --port target/release/gatk-rs

      - name: The committed measurement is the one this run produces
        # Same rule as a golden: the number in the tree has to be the number CI re-derives, or the
        # dashboard is printing a claim nothing checks. A first run publishes the file as an
        # artefact and this step reports the diff rather than failing, which is how the first
        # measurement gets into the tree at all.
        run: git --no-pager diff --stat tools/coverage/measured.json

      - name: Publish what the run measured
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-coverage
          path: tools/coverage/measured.json
          if-no-files-found: ignore

  inventory:
    name: Inventory is internally consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the generated inventory against itself
        # The inventory is generated, so the risk is not that it is wrong by hand but that it
        # is stale or partially regenerated. These checks catch both.
        run: |
          python3 - <<'PY'
          import json, re, sys
          inv = json.load(open('tools/inventory/generated/inventory.json'))
          fail = []

          counts = inv['counts']
          tools = inv['tools']

          if len(tools) != counts['tools']:
              fail.append(f"counts.tools={counts['tools']} but {len(tools)} tool entries")
          if counts['tools'] != counts.get('cli_reported_tools'):
              fail.append(f"tools={counts['tools']} != cli_reported_tools="
                          f"{counts.get('cli_reported_tools')}; the inventory no longer matches "
                          f"what `gatk --list` reports")

          total_args = sum(len(t['arguments']) for t in tools)
          if total_args != counts['arguments']:
              fail.append(f"counts.arguments={counts['arguments']} but {total_args} counted")

          # Every runnable tool must have at least one argument. A zero-argument entry means a
          # non-tool (a metrics definition class) leaked back into the tool list.
          empty = [t['name'] for t in tools if not t['arguments']]
          if empty:
              fail.append(f"{len(empty)} tools with no arguments, e.g. {empty[:5]}")

          # Names must be invocable: the " (Picard)" display suffix must have been stripped.
          suffixed = [t['name'] for t in tools if '(' in t['name']]
          if suffixed:
              fail.append(f"non-invocable tool names present: {suffixed[:5]}")

          # Branch names must be unique, or two tools would collide on one branch.
          branches = [t['branch'] for t in tools]
          dupes = {b for b in branches if branches.count(b) > 1}
          if dupes:
              fail.append(f"duplicate branch names: {sorted(dupes)[:5]}")

          for f in fail:
              print("FAIL:", f)
          print(f"tools={len(tools)} arguments={total_args} "
                f"spark={sum(1 for t in tools if t['spark'])} "
                f"undocumented={sum(1 for t in tools if not t.get('documented', True))}")
          sys.exit(1 if fail else 0)
          PY

      - name: Generator runs and is deterministic
        run: |
          python3 -c "import ast,sys; ast.parse(open('tools/inventory/generate_inventory.py').read())"
          python3 -c "import ast,sys; ast.parse(open('tools/inventory/extract_undocumented.py').read())"
          echo "generators parse"

  dashboard:
    name: The status dashboard matches its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docs/STATUS.md is generated, not written
        # It is generated from the inventory and the vendored port summaries under
        # tools/dashboard/ports, both of which are committed, so this runs with only this
        # repository checked out. Refreshing the summaries from the sibling working copies is
        # `--refresh`, and is a deliberate, reviewable commit.
        run: python3 tools/dashboard/generate.py --check

  coverage:
    name: Covering arrays cover what they claim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The arrays are verified, not asserted
        # --verify enumerates every t-way tuple of the domain and checks the array covers it, so a
        # regression in the generator fails here rather than producing an array that looks covered.
        # One small tool, one large one, and t=3 on the large one, which is the shape the plan
        # commits to on the critical path.
        run: |
          python3 tools/coverage/covering.py --tool CollectQualityYieldMetrics --t 2 --verify
          python3 tools/coverage/covering.py --tool HaplotypeCaller --t 2 --verify
          python3 tools/coverage/covering.py --tool HaplotypeCaller --t 3 --verify
          python3 tools/coverage/covering.py --tool HaplotypeCaller --t 2 --numeric-policy perturb --verify

      - name: Constraints actually forbid something
        # A constraint that quietly does nothing is indistinguishable from one that works, and the
        # failure mode is silent: the array still verifies, and every row it produces is rejected
        # by the reference at run time (picard-rs decision 0009). So CI asserts that the forbidden
        # count is non-zero and that the array still covers every permitted tuple.
        run: |
          python3 tools/coverage/covering.py --tool CollectQualityYieldMetrics --t 2 \
            --fixtures tools/coverage/constraints.example.json --verify | tee /tmp/c.txt
          grep -q "missing=0" /tmp/c.txt || { echo "constrained array does not cover its space"; exit 1; }
          grep -qE "forbidden by constraints=[1-9]" /tmp/c.txt || {
            echo "the constraint forbade nothing; it is not being applied"
            exit 1
          }

      - name: The generator is deterministic
        # The arrays are meant to be regenerated and diffed. Two runs that disagree would make
        # every diff meaningless, and IPOG has enough tie-breaks for that to happen by accident.
        run: |
          python3 tools/coverage/covering.py --tool HaplotypeCaller --t 2 --json /tmp/a.json >/dev/null
          python3 tools/coverage/covering.py --tool HaplotypeCaller --t 2 --json /tmp/b.json >/dev/null
          cmp /tmp/a.json /tmp/b.json && echo "identical across runs"

      - name: The measured sizing still matches the document
        # docs/what-pairwise-coverage-costs.md states these numbers. If the inventory changes, the
        # document is stale, and a stale number in a sizing document is how a plan drifts.
        run: |
          python3 tools/coverage/covering.py --all --t 2 | tee /tmp/all.txt
          grep -q "oracle runs=19437" /tmp/all.txt || {
            echo "pairwise sizing changed; update docs/what-pairwise-coverage-costs.md"
            exit 1
          }
