name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: LICENSE and README state the same licence
        # gatk-rs is Apache 2.0 because GATK is Apache 2.0; htsjdk-rs and picard-rs are MIT.
        # Getting these crossed is easy and consequential, so it is checked rather than remembered.
        # Several third-party descriptions call GATK BSD-3-Clause; the authority is LICENSE.TXT in
        # the pinned clone.
        run: |
          grep -q "Apache License" LICENSE || { echo "LICENSE is not Apache 2.0"; exit 1; }
          grep -q "Apache License 2.0, matching GATK" README.md || { echo "README licence claim changed"; exit 1; }
          grep -qi "not the official GATK" README.md || { echo "attribution notice missing"; exit 1; }
          echo "licence and attribution consistent"

      - name: The workflow matches the conformance manifest
        # The oracle jobs are generated from tools/conformance/manifest.json. picard-rs's hand
        # edits grew that file to 1556 lines of drifted comparators before this guard existed.
        run: python3 tools/conformance/generate_ci.py --check

      - name: Every committed golden belongs to a declared suite
        # A golden nothing re-derives can only ever be compared against itself; picard-rs decision
        # 0008 records what that cost there.
        run: python3 tools/conformance/audit_goldens.py

  test:
    name: Test on real x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: nasm, which is what makes GKL's igzip exact rather than merely valid
        # `gkl-igzip` links ISA-L, and ISA-L without an assembler falls back to its readable C.
        # That C still returns valid deflate; it is simply not GKL's, and `gkl-deflate` refuses the
        # levels it would have answered rather than guessing. GATKConfig writes at level TWO, which
        # is one of them, so a build without nasm cannot write a block-compressed file at all.
        #
        # The refresh is allowed to FAIL and the install is not. The runner image carries
        # third-party apt sources of its own -- Google Chrome's among them -- and one of those
        # answering a bad hash fails `apt-get update` as a whole, which took three jobs of this
        # workflow down for a reason that has nothing to do with this repository. What the gate is
        # actually about is the next two commands: nasm installs from the distribution's own
        # archive, and it runs.
        run: |
          sudo apt-get update -qq || echo "apt refresh incomplete; the install below is the gate"
          sudo apt-get install -y -qq nasm
          nasm -v

      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned; must match rust-toolchain.toml.
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Every ported symbol comes from a licence-compatible source
        # htsjdk-rs decision 0014: a transcription of GPL2-only HotSpot source was published in an
        # MIT crate and found eleven commits later by reading module headers. The same guard runs
        # in all three repositories now, not just the one where it was learned.
        run: python3 tools/audit/provenance.py crates

      - name: A change made for speed cannot reorder arithmetic
        # Milestone S, S.2 (#109). The suites catch a moved byte only where their corpus reaches;
        # this refuses fused multiply-add, fast-math intrinsics, SIMD and build flags outright,
        # and ratchets the host transcendentals per file. The self-test plants each violation in
        # a scratch tree and fails if one is not caught.
        run: |
          python3 tools/audit/arithmetic.py
          python3 tools/audit/arithmetic.py --self-test

      - name: Every device kernel meets the eligibility rule
        # Milestone GPU.1 (docs/gpu/eligibility.md). A kernel is a second implementation of a
        # byte-identical path, so it may hold no construct whose answer depends on the device: the
        # guard refuses floating point in an integer kernel, fused and fast-math operations,
        # width-dependent reductions and atomics, and a host that compiles with fast math on.
        run: |
          python3 tools/audit/gpu_kernels.py
          python3 tools/audit/gpu_kernels.py --self-test

      - name: A file already explained does not lose its explanations
        # docs/COMMENTING.md. The guard is a ratchet, not a floor for the whole tree: it fails only
        # when a file on tools/audit/commented.txt drops below the density it was recorded at, so
        # the remaining files are a measured list rather than a feeling.
        run: python3 tools/audit/comment_density.py --check

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release

      - name: The ports below are pinned by revision, and every revision resolves
        # GATK's build.gradle pins picardVersion and htsjdkVersion. A floating dependency would let
        # the layer underneath change under a byte-identity claim without anything failing.
        #
        # Checking the FORM of the pin is not enough. `picard-analysis` carried htsjdk-rs's SHA on a
        # picard-rs URL for months and nothing noticed, because no crate depended on it: cargo never
        # resolved the pin, so it never had to exist. Every revision named in Cargo.toml must also
        # appear in Cargo.lock, which is cargo's own record of having resolved it.
        run: |
          if grep -E '^(htsjdk|picard|jmath)[a-z-]* = \{ git' Cargo.toml | grep -qv 'rev = "'; then
            echo "a dependency is not pinned to a revision"
            exit 1
          fi
          revisions=$(grep -oE 'rev = "[0-9a-f]+"' Cargo.toml | grep -oE '[0-9a-f]+' | sort -u)
          for revision in $revisions; do
            if ! grep -q "$revision" Cargo.lock; then
              echo "revision $revision is pinned in Cargo.toml and resolved nowhere in Cargo.lock"
              exit 1
            fi
          done
          echo "$revisions" | wc -l

  determinism:
    name: "Determinism: the same suites in a different environment"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: nasm, which is what makes GKL's igzip exact rather than merely valid
        # `gkl-igzip` links ISA-L, and ISA-L without an assembler falls back to its readable C.
        # That C still returns valid deflate; it is simply not GKL's, and `gkl-deflate` refuses the
        # levels it would have answered rather than guessing. GATKConfig writes at level TWO, which
        # is one of them, so a build without nasm cannot write a block-compressed file at all.
        #
        # The refresh is allowed to FAIL and the install is not. The runner image carries
        # third-party apt sources of its own -- Google Chrome's among them -- and one of those
        # answering a bad hash fails `apt-get update` as a whole, which took three jobs of this
        # workflow down for a reason that has nothing to do with this repository. What the gate is
        # actually about is the next two commands: nasm installs from the distribution's own
        # archive, and it runs.
        run: |
          sudo apt-get update -qq || echo "apt refresh incomplete; the install below is the gate"
          sudo apt-get install -y -qq nasm
          nasm -v

      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned; must match rust-toolchain.toml.
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2

      - name: The suites pass under a foreign locale, timezone, temporary directory and one thread
        # V.7. Every claim in this repository is a byte claim, and a byte claim that holds only in
        # one environment is not one. The `test` job already runs the suites in the runner's own
        # environment; this runs them in a deliberately different one.
        #
        # LC_ALL is the axis that has actually bitten this programme: htsjdk-rs decision 0011
        # established that the REFERENCE's metrics formatting is locale-dependent, and the oracle
        # pins en_US because of it. Rust's `format!` is locale-independent by construction, so this
        # gate is what turns "by construction" into "measured": under fr_FR a locale-sensitive
        # formatter writes `0,333333` and every suite comparing a formatted number would fail.
        #
        # TZ moves any accidental date formatting; TMPDIR moves every fixture the suites write, so
        # a path that leaked into an output would show; and one test thread removes the scheduling
        # that hid a fixture race until it reached a loaded runner.
        run: |
          set -eux
          mkdir -p /tmp/gatk-rs-elsewhere
          sudo locale-gen fr_FR.UTF-8 || true
          LC_ALL=fr_FR.UTF-8 LANG=fr_FR.UTF-8 TZ=Asia/Kolkata \
            TMPDIR=/tmp/gatk-rs-elsewhere RUST_TEST_THREADS=1 \
            cargo test --workspace --release

      - name: Two clean builds of the same source are the same bytes
        # A port whose own build is not reproducible cannot support a claim that its output is.
        # One crate is enough to catch a build that embeds a path, a timestamp or a hostname, and
        # `gatk-engine` is the one every tool depends on.
        run: |
          set -eux
          cargo build --release -p gatk-engine
          find target/release -maxdepth 1 -name 'libgatk_engine*.rlib' -exec sha256sum {} \; \
            | sed 's#.*/##' > /tmp/build1.txt
          cargo clean
          cargo build --release -p gatk-engine
          find target/release -maxdepth 1 -name 'libgatk_engine*.rlib' -exec sha256sum {} \; \
            | sed 's#.*/##' > /tmp/build2.txt
          diff /tmp/build1.txt /tmp/build2.txt
          cat /tmp/build1.txt

  gpu:
    name: "GPU: the same suites on the device path"
    # Milestone GPU.3. A device run is not a separate claim but the same one on other hardware, so
    # it runs the `test` job's suites, compared by the same assertions, with the PairHMM routed
    # through the Metal kernel. The tests refuse to pass if GATK_RS_GPU is set and the device path
    # did not run, so a runner without Metal fails here rather than falling back to the CPU.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned; must match rust-toolchain.toml.
          toolchain: "1.97.1"

      - uses: Swatinem/rust-cache@v2

      - name: autotools, which isal-sys's build script runs and the macOS image lacks
        run: brew install autoconf automake libtool

      - name: Record the device, its driver and the toolkit
        env:
          GATK_RS_GPU: "1"
        run: |
          system_profiler SPDisplaysDataType
          python3 tools/provenance/record.py --out provenance-gpu.json

      - name: Every suite on the CPU path, as this runner's own baseline
        # The same binaries, without GATK_RS_GPU. A suite this host cannot pass on its CPU (ISA-L's
        # igzip has no ARM path, so GKL's level 2 refuses here) is this host's limit, not the
        # device's, and the `test` job holds the CPU claim on x86-64.
        run: |
          set -o pipefail
          cargo test --workspace --release --features gatk-engine/gpu --no-fail-fast 2>&1 \
            | tee cpu.log || true

      - name: Every suite on the device path, failing exactly where the CPU path fails
        env:
          GATK_RS_GPU: "1"
        run: |
          set -o pipefail
          cargo test --workspace --release --features gatk-engine/gpu --no-fail-fast 2>&1 \
            | tee gpu.log || true
          for side in cpu gpu; do
            if grep -qE "could not compile|failed to run custom build command" $side.log; then echo "$side: build failed"; exit 1; fi
            grep -E '^test .* \.\.\. FAILED$' $side.log | sort > $side-failed.txt || true
            grep -c '^test result' $side.log > $side-binaries.txt
          done
          diff cpu-binaries.txt gpu-binaries.txt
          test "$(cat gpu-binaries.txt)" -gt 0
          echo "test binaries: $(cat gpu-binaries.txt); failing on both paths: $(wc -l < cpu-failed.txt)"
          diff cpu-failed.txt gpu-failed.txt

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: provenance-gpu
          path: provenance-gpu.json

# {{ORACLE_JOBS}}

  argument-coverage:
    name: The covering array, against the port binary
    needs: oracle-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: /tmp/oracle-image.tar
          key: gatk-rs-oracle-${{ hashFiles('tools/oracle/**') }}
          fail-on-cache-miss: true

      - run: docker load -i /tmp/oracle-image.tar

      - name: nasm, which is what makes GKL's igzip exact rather than merely valid
        # `gkl-igzip` links ISA-L, and ISA-L without an assembler falls back to its readable C.
        # That C still returns valid deflate; it is simply not GKL's, and `gkl-deflate` refuses the
        # levels it would have answered rather than guessing. GATKConfig writes at level TWO, which
        # is one of them, so a build without nasm cannot write a block-compressed file at all.
        #
        # The refresh is allowed to FAIL and the install is not. The runner image carries
        # third-party apt sources of its own -- Google Chrome's among them -- and one of those
        # answering a bad hash fails `apt-get update` as a whole, which took three jobs of this
        # workflow down for a reason that has nothing to do with this repository. What the gate is
        # actually about is the next two commands: nasm installs from the distribution's own
        # archive, and it runs.
        run: |
          sudo apt-get update -qq || echo "apt refresh incomplete; the install below is the gate"
          sudo apt-get install -y -qq nasm
          nasm -v

      - name: Build the port binary
        # linux/amd64, which is what the container runs. The port is executed INSIDE the container
        # rather than on the host, and the reason is the output: a Tribble index records the file
        # it was built from by path and by last-modified time, so a port run at a different mount
        # point produces a different index for a reason that is not the port's.
        run: cargo build --release -p gatk-cli

      - name: h5py, which reads an HDF5 output back as its tree of datasets
        # The HDF5 library stamps every object header with the time it was made, so two runs of the
        # reference write different bytes; run_array.py compares the groups, datasets and values
        # instead, and needs a reader for that. Without one it falls back to a digest, which would
        # differ on every row that writes a matrix.
        run: |
          sudo apt-get install -y -qq python3-h5py
          python3 -c "import h5py; print(h5py.version.version)"

      - name: Run the array against both sides
        run: |
          # Four tools side by side over one corpus: the runner has four cores, and each row is one
          # container at a time within its tool.
          python3 tools/coverage/measure.py --jobs 4 \
            --tool IndexFeatureFile --tool PrintBGZFBlockInformation --tool CountReads \
            --tool CountVariants --tool CreateHadoopBamSplittingIndex \
            --tool PrintReads --tool GatherVcfsCloud --tool ApplyBQSR \
            --tool CountBases --tool FlagStat \
            --tool CountReadsSpark --tool CountBasesSpark --tool FlagStatSpark \
            --tool CountVariantsSpark --tool PrintReadsSpark --tool PileupSpark \
            --tool BaseRecalibratorSpark --tool ApplyBQSRSpark --tool BQSRPipelineSpark \
            --tool SortSamSpark --tool PrintVariantsSpark --tool RevertSamSpark \
            --tool CollectInsertSizeMetricsSpark --tool CompareDuplicatesSpark \
            --tool CollectMultipleMetricsSpark --tool MarkDuplicatesSpark --tool CollectAllelicCountsSpark \
            --tool BwaSpark --tool BwaAndMarkDuplicatesPipelineSpark --tool ParallelCopyGCSDirectoryIntoHDFSSpark --tool PathSeqBwaSpark --tool PathSeqPipelineSpark --tool FindBadGenomicKmersSpark --tool CalcMetadataSpark --tool ExtractSVEvidenceSpark --tool DiscoverVariantsFromContigAlignmentsSAMSpark --tool SvDiscoverFromLocalAssemblyContigAlignmentsSpark --tool CpxVariantReInterpreterSpark --tool HtsgetReader --tool HaplotypeCallerSpark --tool ReadsPipelineSpark --tool PathSeqFilterSpark --tool PathSeqScoreSpark \
            --tool PlotDenoisedCopyRatios --tool PlotModeledSegments --tool DetermineGermlineContigPloidy \
            --tool GermlineCNVCaller --tool PostprocessGermlineCNVCalls --tool ScoreVariantAnnotations \
            --tool TrainVariantAnnotationsModel --tool NVScoreVariants \
            --tool FindBreakpointEvidenceSpark --tool StructuralVariationDiscoveryPipelineSpark \
            --tool GenomicsDBImport \
            --tool ExtractOriginalAlignmentRecordsByNameSpark --tool MeanQualityByCycleSpark \
            --tool QualityScoreDistributionSpark --tool CollectBaseDistributionByCycleSpark \
            --tool CollectQualityYieldMetricsSpark \
            --tool CountBasesInReference \
            --tool SplitIntervals \
