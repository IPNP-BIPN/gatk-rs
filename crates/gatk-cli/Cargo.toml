[package]
name = "gatk-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

# `gatk <Tool> <args>`: the reference's own command, letter for letter, so a GATK command line runs
# unchanged. Comparing the two means naming each by its path, never by `gatk` on a PATH.
[[bin]]
name = "gatk"
path = "src/main.rs"

[dependencies]
jmath.workspace = true
gatk-annotation = { path = "../gatk-annotation" }
gatk-barclay = { path = "../gatk-barclay" }
gatk-engine = { path = "../gatk-engine" }
gatk-readfilter = { path = "../gatk-readfilter" }
gatk-tools = { path = "../gatk-tools" }
# PathSeqBuildReferenceTaxonomy reads its catalogs through `GZIPInputStream` and its taxonomy
# dump as a tar.gz, neither of which is BGZF.
flate2 = "1"
htsjdk-bam.workspace = true
# The file plumbing under a runner: a block-compressed input is decompressed before the port's own
# function is handed its text.
htsjdk-bgzf.workspace = true
# SplitCRAM, which walks a CRAM's containers and writes them back.
htsjdk-cram.workspace = true
# The index a VCF WRITER builds on the fly, which is not the one IndexFeatureFile builds from the
# same file: the dictionary is properties and the file's own stats are left at zero.
htsjdk-tribble.workspace = true
htsjdk-vcf.workspace = true
# FuncotatorDataSourceDownloader's --validate-integrity.
sha2.workspace = true

[dev-dependencies]
gatk-corpus = { path = "../gatk-corpus" }
# The off-ramp conformance reads back the zip RampedHaplotypeCaller wrote.
zip = { version = "9", default-features = false, features = ["deflate"] }
