[package]
name = "gatk-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `--read-name-regex`, whose capture groups `gatk_engine::java_regex` does not carry.
regex = "1"
# CombineGVCFs combines the raw annotations its inputs carry, and reads which ones through the
# annotation catalogue.
gatk-annotation = { path = "../gatk-annotation" }
gatk-engine = { path = "../gatk-engine" }
gatk-readfilter = { path = "../gatk-readfilter" }
bwa-mem4.workspace = true
bwa-mem4-core.workspace = true
bwa-mem4-index.workspace = true
bwa-mem4-mem.workspace = true
gatk-fermilite = { path = "../gatk-fermilite" }
clap.workspace = true
tempfile = "3"
htsjdk-bam.workspace = true
# CheckTerminatorBlock is the tool's decision over the termination check this carries.
htsjdk-bgzf.workspace = true
# IndexFeatureFile writes a tribble index, which htsjdk-rs already builds byte for byte.
# ReferenceBlockConcordance writes three metrics files, which is this crate's MetricsFile.
htsjdk-metrics.workspace = true
htsjdk-tribble.workspace = true
htsjdk-vcf.workspace = true
# The coverage filter takes a median, which is commons-math's `Median` and therefore jmath's.
jmath.workspace = true
# GenomicsDBImport's tiles are C zlib's deflate, which the flate2 in this workspace is not.
libz-sys = "1"
md-5.workspace = true
# NVScoreVariants refuses weights whose hash is not the one pinned.
sha2.workspace = true
# HtsgetReader's JSON, which is Jackson's in the reference.
serde_json = "1"
# RampedHaplotypeCaller's off and on ramps are zip files of the run's state.
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
# One corpus parser for the whole workspace: two parsers would be two corpora.
gatk-corpus = { path = "../gatk-corpus" }
