[package]
name = "gatk-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fgkl-smithwaterman.workspace = true
htsjdk-bam.workspace = true
htsjdk-bgzf.workspace = true
# The allele and sample axes of a likelihood matrix are defined over htsjdk alleles.
htsjdk-tribble.workspace = true
htsjdk-vcf.workspace = true
jmath.workspace = true
# Pinned exactly, not by caret range: a byte-identity claim cannot float its dependencies.

# Milestone GPU's device path: Metal on macOS, CUDA on Linux (the second architecture of GPU.1).
[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "=0.33.0", optional = true }

# Loaded at run time, so the build needs no CUDA toolkit and a host without one answers `None`.
[target.'cfg(target_os = "linux")'.dependencies]
cudarc = { version = "=0.19.10", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12040"] }

[features]
gpu = ["dep:metal", "dep:cudarc"]

[dev-dependencies]
flate2 = "1"
# One corpus parser for the whole workspace: two parsers would be two corpora.
gatk-corpus = { path = "../gatk-corpus" }
