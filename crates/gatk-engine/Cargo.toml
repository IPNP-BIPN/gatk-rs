[package]
name = "gatk-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
htsjdk-bam.workspace = true
# Pinned exactly, not by caret range: a byte-identity claim cannot float its dependencies.
noodles-fasta = "=0.61.0"

[dev-dependencies]
# One corpus parser for the whole workspace: two parsers would be two corpora.
gatk-corpus = { path = "../gatk-corpus" }
