[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
# GATK is Apache 2.0, not BSD-3-Clause, whatever several third-party descriptions say. htsjdk-rs
# and picard-rs are MIT, matching their references; the three repositories of this programme
# deliberately do not share one licence.
license = "Apache-2.0"
repository = "https://github.com/IPNP-BIPN/gatk-rs"

# Both dependencies are pinned by revision, never by branch, mirroring how GATK's build.gradle
# pins picardVersion and htsjdkVersion. A floating dependency would let the layer underneath change
# under a byte-identity claim without anything failing.
#
# The direction is upstream's: Main.getPackageList() returns
# ["org.broadinstitute.hellbender", "picard"], which is why `gatk MarkDuplicates` runs Picard's
# code, and why gatk-rs will depend on picard-rs when a crate here needs it. There is no
# `picard-analysis` line yet on purpose: one stood here for months carrying htsjdk-rs's SHA on
# picard-rs's URL, and nothing noticed, because no crate depended on it and cargo therefore never
# resolved it. A pin nothing resolves is a pin nothing checks, so the line arrives with its first
# caller.
[workspace.dependencies]
# BWA-MEM for `BwaSpark` and what is built on it (IPNP-BIPN/gatk-rs#1390): the same owner's MIT
# reimplementation, because transcribing lh3/bwa is ruled out. Its default features are the
# binary's allocator, htslib output and FASTQ decompressors, none of which a library call reads.
bwa-mem4 = { git = "https://github.com/IPNP-BIPN/bwa-mem4", rev = "41b46129606d0f996e72a91557b1c2f0f0853121", default-features = false }
bwa-mem4-core = { git = "https://github.com/IPNP-BIPN/bwa-mem4", rev = "41b46129606d0f996e72a91557b1c2f0f0853121", default-features = false }
bwa-mem4-index = { git = "https://github.com/IPNP-BIPN/bwa-mem4", rev = "41b46129606d0f996e72a91557b1c2f0f0853121", default-features = false }
bwa-mem4-mem = { git = "https://github.com/IPNP-BIPN/bwa-mem4", rev = "41b46129606d0f996e72a91557b1c2f0f0853121", default-features = false }
clap = { version = "4", default-features = false, features = ["std", "derive"] }
htsjdk-bam = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "c34738519182301fb8e6ef6890be46eddcd96e27" }
# GATKConfig writes at compression level TWO, which GKL routes through ISA-L igzip rather than zlib.
# htsjdk-rs ports igzip levels 1-2 in Rust (its decision 0050) instead of linking ISA-L, whose output
# depends on where its stream struct lives: one hash bucket is derived from that address, so a linked
# ISA-L wrote a different BAM from run to run (MarkDuplicatesSpark row 2). `gkl-igzip` is now a no-op.
htsjdk-bgzf = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "c34738519182301fb8e6ef6890be46eddcd96e27", features = ["gkl-igzip"] }
# `SplitCRAM` walks containers and copies them, which is the only CRAM a ported tool touches.
htsjdk-cram = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "c34738519182301fb8e6ef6890be46eddcd96e27" }
htsjdk-metrics = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "c34738519182301fb8e6ef6890be46eddcd96e27" }
htsjdk-tribble = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "c34738519182301fb8e6ef6890be46eddcd96e27" }
htsjdk-vcf = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "c34738519182301fb8e6ef6890be46eddcd96e27" }
jmath = { git = "https://github.com/IPNP-BIPN/htsjdk-rs", rev = "c34738519182301fb8e6ef6890be46eddcd96e27" }
# GatherBamFiles writes a .md5 beside its output, which is the only digest a ported tool computes
# for itself. htsjdk-bam already pulls this crate in for the same algorithm.
md-5 = "0.11.0"
# FuncotatorDataSourceDownloader checks the archive it copied against a SHA-256 sum.
sha2 = "0.11.0"
