name: HaplotypeCaller x86 profile (scratch, PR #1467)

# Temporary: GATK 4.7.0.0 and c/streaming-regions (main holds the whole BAM, ~30 GB, more than a
# runner has) on the same chr20 of NA12878 30x, one
# after another on one runner, at one thread each. Not for merging.

on:
  push:
    branches: [c/streaming-regions-prof]
  workflow_dispatch:

jobs:
  bench:
    name: "${{ matrix.runner }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c/streaming-regions
          path: pr
      - uses: actions/checkout@v7
        with:
          ref: c/hc-multicore
          path: mc

      - name: Tools
        run: |
          sudo apt-get update -qq || echo "apt refresh incomplete"
          sudo apt-get install -y -qq nasm samtools time linux-tools-common linux-tools-$(uname -r) || sudo apt-get install -y -qq nasm samtools time linux-tools-generic
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          lscpu | grep -E "Model name|Architecture|^CPU\(s\)|Flags" | cut -c1-400
          free -g

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build both ports
        run: |
          export CARGO_PROFILE_RELEASE_DEBUG=line-tables-only
          (cd pr && cargo build --release -p gatk-cli) && cp pr/target/release/gatk gatk-pr
          (cd mc && cargo build --release -p gatk-cli) && cp mc/target/release/gatk gatk-mc

      - name: GATK 4.7.0.0
        run: |
          curl -sSL -o gatk.zip https://github.com/broadinstitute/gatk/releases/download/4.7.0.0/gatk-4.7.0.0.zip
          unzip -q gatk.zip && ls gatk-4.7.0.0/*local.jar

      - name: chr20 of NA12878 30x
        run: |
          REF=https://storage.googleapis.com/gcp-public-data--broad-references/hg38/v0/Homo_sapiens_assembly38.fasta
          CRAM=https://ftp-trace.ncbi.nlm.nih.gov/1000genomes/ftp/1000G_2504_high_coverage/data/ERR3239334/NA12878.final.cram
          samtools faidx $REF chr20 > chr20.fasta
          samtools faidx chr20.fasta
          samtools dict -o chr20.dict chr20.fasta
          samtools view -@ 4 -T chr20.fasta -b -o NA12878.chr20.bam $CRAM chr20
          samtools index NA12878.chr20.bam
          ls -la NA12878.chr20.bam chr20.fasta

      - name: Profile
        shell: bash {0}
        run: |
          PERF=$(ls /usr/lib/linux-tools/*/perf | head -1); echo $PERF
          for b in pr mc; do
            /usr/bin/time -v env RAYON_NUM_THREADS=1 ./gatk-$b HaplotypeCaller -R chr20.fasta -I NA12878.chr20.bam -L chr20:30000000-31000000 -O t-$b.vcf > /dev/null 2> t-$b.err
            grep -E "^\t(User|System) time|^\tMaximum resident" t-$b.err
            grep -v '^##GATKCommandLine' t-$b.vcf | grep -v '^##source' | md5sum
            RAYON_NUM_THREADS=1 $PERF record -F 499 -g -o $b.data ./gatk-$b HaplotypeCaller -R chr20.fasta -I NA12878.chr20.bam -L chr20:30000000-31000000 -O p-$b.vcf > /dev/null 2>&1
            echo "== $b self"; $PERF report -i $b.data --no-children --stdio --percent-limit 0.7 -g none 2>/dev/null | grep -v '^#' | grep -v '^$' | head -45 | tee $b-self.txt
            echo "== $b children"; $PERF report -i $b.data --children --stdio --percent-limit 3 -g none 2>/dev/null | grep -v '^#' | grep -v '^$' | head -45 | tee $b-children.txt
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ matrix.runner }}
          path: |
            *.txt
            *.err
