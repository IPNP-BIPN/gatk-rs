name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: LICENSE and README state the same licence
        # gatk-rs is Apache 2.0 because GATK is Apache 2.0; htsjdk-rs and picard-rs are MIT.
        # Getting these crossed is easy and consequential, so it is checked rather than remembered.
        # Several third-party descriptions call GATK BSD-3-Clause; the authority is LICENSE.TXT in
        # the pinned clone.
        run: |
          grep -q "Apache License" LICENSE || { echo "LICENSE is not Apache 2.0"; exit 1; }
          grep -q "Apache License 2.0, matching GATK" README.md || { echo "README licence claim changed"; exit 1; }
          grep -qi "not the official GATK" README.md || { echo "attribution notice missing"; exit 1; }
          echo "licence and attribution consistent"

      - name: The workflow matches the conformance manifest
        # The oracle jobs are generated from tools/conformance/manifest.json. picard-rs's hand
        # edits grew that file to 1556 lines of drifted comparators before this guard existed.
        run: python3 tools/conformance/generate_ci.py --check

      - name: Every committed golden belongs to a declared suite
        # A golden nothing re-derives can only ever be compared against itself; picard-rs decision
        # 0008 records what that cost there.
        run: python3 tools/conformance/audit_goldens.py

  test:
    name: Test on real x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned; must match rust-toolchain.toml.
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Every ported symbol comes from a licence-compatible source
        # htsjdk-rs decision 0014: a transcription of GPL2-only HotSpot source was published in an
        # MIT crate and found eleven commits later by reading module headers. The same guard runs
        # in all three repositories now, not just the one where it was learned.
        run: python3 tools/audit/provenance.py crates

      - name: A file already explained does not lose its explanations
        # docs/COMMENTING.md. The guard is a ratchet, not a floor for the whole tree: it fails only
        # when a file on tools/audit/commented.txt drops below the density it was recorded at, so
        # the remaining files are a measured list rather than a feeling.
        run: python3 tools/audit/comment_density.py --check

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release

      - name: The ports below are pinned by revision, and every revision resolves
        # GATK's build.gradle pins picardVersion and htsjdkVersion. A floating dependency would let
        # the layer underneath change under a byte-identity claim without anything failing.
        #
        # Checking the FORM of the pin is not enough. `picard-analysis` carried htsjdk-rs's SHA on a
        # picard-rs URL for months and nothing noticed, because no crate depended on it: cargo never
        # resolved the pin, so it never had to exist. Every revision named in Cargo.toml must also
        # appear in Cargo.lock, which is cargo's own record of having resolved it.
        run: |
          if grep -E '^(htsjdk|picard|jmath)[a-z-]* = \{ git' Cargo.toml | grep -qv 'rev = "'; then
            echo "a dependency is not pinned to a revision"
            exit 1
          fi
          revisions=$(grep -oE 'rev = "[0-9a-f]+"' Cargo.toml | grep -oE '[0-9a-f]+' | sort -u)
          for revision in $revisions; do
            if ! grep -q "$revision" Cargo.lock; then
              echo "revision $revision is pinned in Cargo.toml and resolved nowhere in Cargo.lock"
              exit 1
            fi
          done
          echo "$revisions" | wc -l

# The jobs below this line are generated from tools/conformance/manifest.json by
# tools/conformance/generate_ci.py. Edit the manifest, not this file: the `guard` job
# fails if the two disagree.
  oracle-image:
    name: Build the pinned oracle image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record the host CPU
        run: grep -m1 'model name' /proc/cpuinfo; grep -m1 'vendor_id' /proc/cpuinfo

      - id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/oracle-image.tar
          key: gatk-rs-oracle-${{ hashFiles('tools/oracle/**') }}

      - name: Build the oracle image
        # The probe runs during the build, so a degraded environment cannot produce an image, let
        # alone a golden. The image is built once and shared with every suite below, because
        # rebuilding it per suite would multiply a five-minute build by the number of suites.
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker build --platform linux/amd64 -t gatk-rs-oracle:4.6.2.0 tools/oracle
          docker save gatk-rs-oracle:4.6.2.0 -o /tmp/oracle-image.tar

  oracle:
