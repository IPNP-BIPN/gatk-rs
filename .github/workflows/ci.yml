name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  guard:
    name: Repository invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: LICENSE and README state the same licence
        # gatk-rs is Apache 2.0 because GATK is Apache 2.0; htsjdk-rs and picard-rs are MIT.
        # Getting these crossed is easy and consequential, so it is checked rather than remembered.
        # Several third-party descriptions call GATK BSD-3-Clause; the authority is LICENSE.TXT in
        # the pinned clone.
        run: |
          grep -q "Apache License" LICENSE || { echo "LICENSE is not Apache 2.0"; exit 1; }
          grep -q "Apache License 2.0, matching GATK" README.md || { echo "README licence claim changed"; exit 1; }
          grep -qi "not the official GATK" README.md || { echo "attribution notice missing"; exit 1; }
          echo "licence and attribution consistent"

      - name: The workflow matches the conformance manifest
        # The oracle jobs are generated from tools/conformance/manifest.json. picard-rs's hand
        # edits grew that file to 1556 lines of drifted comparators before this guard existed.
        run: python3 tools/conformance/generate_ci.py --check

      - name: Every committed golden belongs to a declared suite
        # A golden nothing re-derives can only ever be compared against itself; picard-rs decision
        # 0008 records what that cost there.
        run: python3 tools/conformance/audit_goldens.py

  test:
    name: Test on real x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          # Pinned; must match rust-toolchain.toml.
          toolchain: "1.97.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Every ported symbol comes from a licence-compatible source
        # htsjdk-rs decision 0014: a transcription of GPL2-only HotSpot source was published in an
        # MIT crate and found eleven commits later by reading module headers. The same guard runs
        # in all three repositories now, not just the one where it was learned.
        run: python3 tools/audit/provenance.py crates

      - name: A file already explained does not lose its explanations
        # docs/COMMENTING.md. The guard is a ratchet, not a floor for the whole tree: it fails only
        # when a file on tools/audit/commented.txt drops below the density it was recorded at, so
        # the remaining files are a measured list rather than a feeling.
        run: python3 tools/audit/comment_density.py --check

      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --release

      - name: The ports below are pinned by revision, not by branch
        # GATK's build.gradle pins picardVersion and htsjdkVersion. A floating dependency would let
        # the layer underneath change under a byte-identity claim without anything failing.
        run: |
          if grep -E '^(htsjdk|picard|jmath)[a-z-]* = \{ git' Cargo.toml | grep -qv 'rev = "'; then
            echo "a dependency is not pinned to a revision"
            exit 1
          fi
          grep -c 'rev = "' Cargo.toml

# The jobs below this line are generated from tools/conformance/manifest.json by
# tools/conformance/generate_ci.py. Edit the manifest, not this file: the `guard` job
# fails if the two disagree.
  oracle-image:
    name: Build the pinned oracle image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record the host CPU
        run: grep -m1 'model name' /proc/cpuinfo; grep -m1 'vendor_id' /proc/cpuinfo

      - id: cache
        uses: actions/cache@v4
        with:
          path: /tmp/oracle-image.tar
          key: gatk-rs-oracle-${{ hashFiles('tools/oracle/**') }}

      - name: Build the oracle image
        # The probe runs during the build, so a degraded environment cannot produce an image, let
        # alone a golden. The image is built once and shared with every suite below, because
        # rebuilding it per suite would multiply a five-minute build by the number of suites.
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker build --platform linux/amd64 -t gatk-rs-oracle:4.6.2.0 tools/oracle
          docker save gatk-rs-oracle:4.6.2.0 -o /tmp/oracle-image.tar

  oracle:
    name: "oracle ${{ matrix.group }} ${{ matrix.index }}"
    needs: oracle-image
    runs-on: ubuntu-latest
    strategy:
      # One suite's divergence must not cancel the others: the point of the run is to learn which
      # suites diverge, not to learn that at least one does.
      fail-fast: false
      matrix:
        include:
          - group: oracle-backed
            index: "1/23"
            slug: "annotation-original-alignment-annotation-per-allele-variant-getters-annotation-likelihood-counts-genotyper-allele-likelihoods"
            suites: "annotation-original-alignment annotation-per-allele variant-getters annotation-likelihood-counts genotyper-allele-likelihoods"
          - group: oracle-backed
            index: "2/23"
            slug: "genotyper-allele-list-annotation-counting-readfilters-readsdatasource-referencecontext"
            suites: "genotyper-allele-list annotation-counting readfilters readsdatasource referencecontext"
          - group: oracle-backed
            index: "3/23"
            slug: "readwalker-printreads-record-transform-fix-misencoded-add-oa-tags"
            suites: "readwalker printreads record-transform fix-misencoded add-oa-tags"
          - group: oracle-backed
            index: "4/23"
            slug: "print-distant-mates-split-reads-left-align-indels-left-align-indels-tool-clip-reads"
            suites: "print-distant-mates split-reads left-align-indels left-align-indels-tool clip-reads"
          - group: oracle-backed
            index: "5/23"
            slug: "transfer-read-tags-print-reads-header-post-process-reads-for-rsem-convert-headerless-shard-gatk-report"
            suites: "transfer-read-tags print-reads-header post-process-reads-for-rsem convert-headerless-shard gatk-report"
          - group: oracle-backed
            index: "6/23"
            slug: "recal-datum-covariates-qual-quantizer-recalibration-tables-gatk-report-reader"
            suites: "recal-datum covariates qual-quantizer recalibration-tables gatk-report-reader"
          - group: oracle-backed
            index: "7/23"
            slug: "bqsr-transformer-recalibration-report-apply-bqsr-baq-base-recalibration-engine"
            suites: "bqsr-transformer recalibration-report apply-bqsr baq base-recalibration-engine"
          - group: oracle-backed
            index: "8/23"
            slug: "base-recalibrator-read-anonymizer-intervalwalker-alignmentstate-pileupelement"
            suites: "base-recalibrator read-anonymizer intervalwalker alignmentstate pileupelement"
          - group: oracle-backed
            index: "9/23"
            slug: "intervalfile-jexlfilter-featurecache-readpileup-readstates"
            suites: "intervalfile jexlfilter featurecache readpileup readstates"
          - group: oracle-backed
            index: "10/23"
            slug: "locusiterator-acbuilder-locuswalker-javarandom-reservoir"
            suites: "locusiterator acbuilder locuswalker javarandom reservoir"
          - group: oracle-backed
            index: "11/23"
            slug: "well19937c-leveling-variantwalker-activityprofile-assemblyregion"
            suites: "well19937c leveling variantwalker activityprofile assemblyregion"
          - group: oracle-backed
            index: "12/23"
            slug: "intervaliterators-assemblyregioniterator-assemblyregionwalker-mann-whitney-annotation-rank-sum"
            suites: "intervaliterators assemblyregioniterator assemblyregionwalker mann-whitney annotation-rank-sum"
          - group: oracle-backed
            index: "13/23"
            slug: "annotation-strand-bias-annotation-read-grouping-annotation-depth-per-allele-annotation-flow-annotation-site-statistics"
            suites: "annotation-strand-bias annotation-read-grouping annotation-depth-per-allele annotation-flow annotation-site-statistics"
          - group: oracle-backed
            index: "14/23"
            slug: "annotation-heterozygosity-and-mq-annotation-allele-specific-rank-sum-annotation-allele-specific-strand-bias-annotation-allele-specific-site-statistics-annotation-pedigree"
            suites: "annotation-heterozygosity-and-mq annotation-allele-specific-rank-sum annotation-allele-specific-strand-bias annotation-allele-specific-site-statistics annotation-pedigree"
          - group: oracle-backed
            index: "15/23"
            slug: "annotation-fragment-counts-annotation-haplotype-filtering-multipasswalker-barclay-value-model-barclay-tagged-arguments"
            suites: "annotation-fragment-counts annotation-haplotype-filtering multipasswalker barclay-value-model barclay-tagged-arguments"
          - group: oracle-backed
            index: "16/23"
            slug: "barclay-argument-collections-barclay-arguments-file-barclay-plugin-descriptors-natural-log-utils-somatic-likelihoods"
            suites: "barclay-argument-collections barclay-arguments-file barclay-plugin-descriptors natural-log-utils somatic-likelihoods"
          - group: oracle-backed
            index: "17/23"
            slug: "decimal-format-allele-pseudo-depth-counting-walkers-sa-tag-builder-overhang-fixing-manager"
            suites: "decimal-format allele-pseudo-depth counting-walkers sa-tag-builder overhang-fixing-manager"
          - group: oracle-backed
            index: "18/23"
            slug: "split-n-cigar-reads-methylation-type-caller-get-sample-name-compare-base-qualities-sam-pileup-codec"
            suites: "split-n-cigar-reads methylation-type-caller get-sample-name compare-base-qualities sam-pileup-codec"
          - group: oracle-backed
            index: "19/23"
            slug: "check-pileup-dump-tabix-index-tsv-table-pileup-summary-contamination-tables"
            suites: "check-pileup dump-tabix-index tsv-table pileup-summary contamination-tables"
          - group: oracle-backed
            index: "20/23"
            slug: "persistence-optimizer-analyze-covariates-remove-nearby-indels-update-vcf-sequence-dictionary-left-align-and-trim"
            suites: "persistence-optimizer analyze-covariates remove-nearby-indels update-vcf-sequence-dictionary left-align-and-trim"
          - group: oracle-backed
            index: "21/23"
            slug: "trim-alleles-split-biallelics-left-align-and-trim-variants-genotype-index-subset-alleles"
            suites: "trim-alleles split-biallelics left-align-and-trim-variants genotype-index subset-alleles"
          - group: oracle-backed
            index: "22/23"
            slug: "split-with-likelihoods-variant-filtration-gather-vcfs-select-variants-samples-java-regex"
            suites: "split-with-likelihoods variant-filtration gather-vcfs select-variants-samples java-regex"
          - group: oracle-backed
            index: "23/23"
            slug: "select-variants-subset-select-variants-filters-select-variants-output"
            suites: "select-variants-subset select-variants-filters select-variants-output"
          - group: golden-pending
            index: "1/1"
            slug: "select-variants-concordance"
            suites: "select-variants-concordance"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: /tmp/oracle-image.tar
          key: gatk-rs-oracle-${{ hashFiles('tools/oracle/**') }}
          fail-on-cache-miss: true

      - run: docker load -i /tmp/oracle-image.tar

      - name: Regenerate and compare
        # Every rule that canonicalizes anything away is declared in tools/conformance/manifest.json
        # with the reason it is there; tools/conformance/compare.py is the only code that applies
        # them. Run the same thing locally with:
        #   python3 tools/conformance/run_suite.py --suites "${{ matrix.suites }}"
        run: python3 tools/conformance/run_suite.py --suites "${{ matrix.suites }}"

      - name: Publish what the container produced
        # Two cases, one artefact. A `golden-pending` suite has no golden to compare against and
        # one may not be committed from a developer machine (decision 0008). An `oracle-backed`
        # suite whose dump has grown a case needs its golden refreshed, and that refresh has to
        # come from here for the same reason. Both land in tools/conformance/pending/, and
        # committing the file is what makes the claim.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-goldens-${{ matrix.slug }}
          path: tools/conformance/pending/
          if-no-files-found: ignore


  inventory:
    name: Inventory is internally consistent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the generated inventory against itself
        # The inventory is generated, so the risk is not that it is wrong by hand but that it
        # is stale or partially regenerated. These checks catch both.
        run: |
          python3 - <<'PY'
          import json, re, sys
          inv = json.load(open('tools/inventory/generated/inventory.json'))
          fail = []

          counts = inv['counts']
          tools = inv['tools']

          if len(tools) != counts['tools']:
              fail.append(f"counts.tools={counts['tools']} but {len(tools)} tool entries")
          if counts['tools'] != counts.get('cli_reported_tools'):
              fail.append(f"tools={counts['tools']} != cli_reported_tools="
                          f"{counts.get('cli_reported_tools')}; the inventory no longer matches "
                          f"what `gatk --list` reports")

          total_args = sum(len(t['arguments']) for t in tools)
          if total_args != counts['arguments']:
              fail.append(f"counts.arguments={counts['arguments']} but {total_args} counted")

          # Every runnable tool must have at least one argument. A zero-argument entry means a
          # non-tool (a metrics definition class) leaked back into the tool list.
          empty = [t['name'] for t in tools if not t['arguments']]
          if empty:
              fail.append(f"{len(empty)} tools with no arguments, e.g. {empty[:5]}")

          # Names must be invocable: the " (Picard)" display suffix must have been stripped.
          suffixed = [t['name'] for t in tools if '(' in t['name']]
          if suffixed:
              fail.append(f"non-invocable tool names present: {suffixed[:5]}")

          # Branch names must be unique, or two tools would collide on one branch.
          branches = [t['branch'] for t in tools]
          dupes = {b for b in branches if branches.count(b) > 1}
          if dupes:
              fail.append(f"duplicate branch names: {sorted(dupes)[:5]}")

          for f in fail:
              print("FAIL:", f)
          print(f"tools={len(tools)} arguments={total_args} "
                f"spark={sum(1 for t in tools if t['spark'])} "
                f"undocumented={sum(1 for t in tools if not t.get('documented', True))}")
          sys.exit(1 if fail else 0)
          PY

      - name: Generator runs and is deterministic
        run: |
          python3 -c "import ast,sys; ast.parse(open('tools/inventory/generate_inventory.py').read())"
          python3 -c "import ast,sys; ast.parse(open('tools/inventory/extract_undocumented.py').read())"
          echo "generators parse"

  dashboard:
    name: The status dashboard matches its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: docs/STATUS.md is generated, not written
        # It is generated from the inventory and the vendored port summaries under
        # tools/dashboard/ports, both of which are committed, so this runs with only this
        # repository checked out. Refreshing the summaries from the sibling working copies is
        # `--refresh`, and is a deliberate, reviewable commit.
        run: python3 tools/dashboard/generate.py --check

  coverage:
    name: Covering arrays cover what they claim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The arrays are verified, not asserted
        # --verify enumerates every t-way tuple of the domain and checks the array covers it, so a
        # regression in the generator fails here rather than producing an array that looks covered.
        # One small tool, one large one, and t=3 on the large one, which is the shape the plan
        # commits to on the critical path.
        run: |
          python3 tools/coverage/covering.py --tool CollectQualityYieldMetrics --t 2 --verify
          python3 tools/coverage/covering.py --tool HaplotypeCaller --t 2 --verify
          python3 tools/coverage/covering.py --tool HaplotypeCaller --t 3 --verify
          python3 tools/coverage/covering.py --tool HaplotypeCaller --t 2 --numeric-policy perturb --verify

      - name: Constraints actually forbid something
        # A constraint that quietly does nothing is indistinguishable from one that works, and the
        # failure mode is silent: the array still verifies, and every row it produces is rejected
        # by the reference at run time (picard-rs decision 0009). So CI asserts that the forbidden
        # count is non-zero and that the array still covers every permitted tuple.
        run: |
          python3 tools/coverage/covering.py --tool CollectQualityYieldMetrics --t 2 \
            --fixtures tools/coverage/constraints.example.json --verify | tee /tmp/c.txt
          grep -q "missing=0" /tmp/c.txt || { echo "constrained array does not cover its space"; exit 1; }
          grep -qE "forbidden by constraints=[1-9]" /tmp/c.txt || {
            echo "the constraint forbade nothing; it is not being applied"
            exit 1
          }

      - name: The generator is deterministic
        # The arrays are meant to be regenerated and diffed. Two runs that disagree would make
        # every diff meaningless, and IPOG has enough tie-breaks for that to happen by accident.
        run: |
          python3 tools/coverage/covering.py --tool HaplotypeCaller --t 2 --json /tmp/a.json >/dev/null
          python3 tools/coverage/covering.py --tool HaplotypeCaller --t 2 --json /tmp/b.json >/dev/null
          cmp /tmp/a.json /tmp/b.json && echo "identical across runs"

      - name: The measured sizing still matches the document
        # docs/what-pairwise-coverage-costs.md states these numbers. If the inventory changes, the
        # document is stale, and a stale number in a sizing document is how a plan drifts.
        run: |
          python3 tools/coverage/covering.py --all --t 2 | tee /tmp/all.txt
          grep -q "oracle runs=19437" /tmp/all.txt || {
            echo "pairwise sizing changed; update docs/what-pairwise-coverage-costs.md"
            exit 1
          }
