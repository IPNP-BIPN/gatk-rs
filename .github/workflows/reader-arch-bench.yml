name: Reader per architecture (scratch, PR #1482)

# Temporary: GATK 4.7.0.0, main, c/streaming-guard and c/reader-prefetch on the same chr20 of
# NA12878 30x, one after another on one runner, default threads. main holds the whole BAM
# (~29 GB), more than a runner has, so it is built but not run. Not for merging.

on:
  push:
    branches: [c/reader-prefetch-bench]
  workflow_dispatch:

jobs:
  bench:
    name: "${{ matrix.runner }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c/reader-prefetch
          path: pr
      - uses: actions/checkout@v7
        with:
          ref: c/streaming-guard
          path: guard
      - uses: actions/checkout@v7
        with:
          ref: c/reader-lazy-tags-try
          path: lazy
      - uses: actions/checkout@v7
        with:
          ref: main
          path: main

      - name: Tools
        run: |
          sudo apt-get update -qq || echo "apt refresh incomplete"
          sudo apt-get install -y -qq nasm samtools time
          lscpu | grep -E "Model name|Architecture|^CPU\(s\)|Flags" | cut -c1-400
          free -g

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build both ports
        run: |
          (cd pr && cargo build --release -p gatk-cli) && cp pr/target/release/gatk gatk-pr
          (cd main && cargo build --release -p gatk-cli) && cp main/target/release/gatk gatk-main
          (cd guard && cargo build --release -p gatk-cli) && cp guard/target/release/gatk gatk-guard
          (cd lazy && cargo build --release -p gatk-cli) && cp lazy/target/release/gatk gatk-lazy

      - name: GATK 4.7.0.0
        run: |
          curl -sSL -o gatk.zip https://github.com/broadinstitute/gatk/releases/download/4.7.0.0/gatk-4.7.0.0.zip
          unzip -q gatk.zip && ls gatk-4.7.0.0/*local.jar

      - name: chr20 of NA12878 30x
        run: |
          REF=https://storage.googleapis.com/gcp-public-data--broad-references/hg38/v0/Homo_sapiens_assembly38.fasta
          CRAM=https://ftp-trace.ncbi.nlm.nih.gov/1000genomes/ftp/1000G_2504_high_coverage/data/ERR3239334/NA12878.final.cram
          samtools faidx $REF chr20 > chr20.fasta
          samtools faidx chr20.fasta
          samtools dict -o chr20.dict chr20.fasta
          samtools view -@ 4 -T chr20.fasta -b -o NA12878.chr20.bam $CRAM chr20
          samtools index NA12878.chr20.bam
          ls -la NA12878.chr20.bam chr20.fasta

      - name: Measure
        shell: bash {0}
        run: |
          JAR=$(ls gatk-4.7.0.0/*local.jar)
          row() { # tool build round
            case $2 in
              java) cmd="java -Xmx12g -jar $JAR" ;;
              *) cmd="./gatk-$2" ;;
            esac
            case $1 in
              CountReads) args="-I NA12878.chr20.bam" ;;
              CountReadsL) args="-I NA12878.chr20.bam -L chr20" ;;
              PrintReads) args="-I NA12878.chr20.bam -O out-$2.bam" ;;
            esac
            tool=${1%L}
            /usr/bin/time -v $cmd $tool $args > $1-$2.log 2> $1-$2.err && code=0 || code=$?
            user=$(awk -F': ' '/User time/{print $2}' $1-$2.err)
            sys=$(awk -F': ' '/System time/{print $2}' $1-$2.err)
            wall=$(awk '/Elapsed/{print $NF}' $1-$2.err)
            rss=$(awk -F': ' '/Maximum resident/{printf "%d MB", $2/1024}' $1-$2.err)
            case $1 in
              PrintReads) out=$( [ -f out-$2.bam ] && samtools view out-$2.bam | md5sum | cut -c1-12 || echo none); rm -f out-$2.bam out-$2.bai ;;
              *) out=$(grep -E '^[0-9]+$' $1-$2.log | tail -1) ;;
            esac
            printf "| %s | %s | %s | %s | %s | %s s | %s | %s |\n" "$1" "$2" "$3" "$code" "$rss" "$(echo "$user + $sys" | bc)" "$wall" "$out" | tee -a table.md
          }
          echo "| tool | build | round | exit | peak RSS | CPU (user+sys) | wall | output |" > table.md
          echo "|---|---|---|---|---|---|---|---|" >> table.md
          for r in 1 2; do for t in CountReads CountReadsL PrintReads; do for b in java pr lazy; do row $t $b $r; done; done; done
          cat table.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bench-${{ matrix.runner }}
          path: |
            table.md
            *.err
